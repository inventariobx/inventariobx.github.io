<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Inventario BX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#17212e; --muted:#5b6778; --line:#dde3ea;
  --accent:#1f3a5f; --accent-fg:#ffffff; --accent-soft:#e6edf6; --chip:#eef1f5;
  --ok:#2f6b46; --ok-soft:#e3f1e8; --warn:#8a5a12; --warn-soft:#f8eedc;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#161d27; --fg:#e4e9f0; --muted:#97a3b4; --line:#273242;
  --accent:#8fb2e0; --accent-fg:#0f141b; --accent-soft:#1d2a3b; --chip:#1d2633;
  --ok:#8fd0a7; --ok-soft:#183024; --warn:#e6bf7a; --warn-soft:#332713; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.brand b{font-size:1rem;font-weight:600;letter-spacing:.01em}
.brand span{font-size:.75rem;color:var(--muted)}
.tagline{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.bigcode{font-family:var(--mono);font-size:1.7rem;font-weight:600;letter-spacing:.03em}
.owner{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);padding:3px 8px;border-radius:4px}
h1{font-size:1.3rem;font-weight:600;margin:0 0 16px;text-wrap:balance}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:680px){.sheet{grid-template-columns:1fr}}
.photo{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--chip)}
.nophoto{aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);background:repeating-linear-gradient(45deg,var(--chip) 0 10px,var(--surface) 10px 20px);text-align:center;padding:16px}
dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
dl div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
dl div:first-child{border-top:0}
dt{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
dd{margin:0;overflow-wrap:anywhere}
dd.mono{font-family:var(--mono);font-size:.88rem}
.state{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:4px}
.state.si{background:var(--ok-soft);color:var(--ok)}
.state.no{background:var(--warn-soft);color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.code{font-family:var(--mono);font-weight:600;font-size:.86rem}
.row span:last-child{min-width:0}
.row small{display:block;color:var(--muted)}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;margin-bottom:12px}
a.back{display:inline-block;color:var(--accent);font-weight:500;text-decoration:none;margin-bottom:12px}
.foot{margin-top:24px;font-size:.78rem;color:var(--muted)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
#lock{max-width:380px;margin:40px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:1.1rem;font-weight:600}
#lock p{margin:0;color:var(--muted);font-size:.88rem}
#lock input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
#lock label.rem{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
#lock button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
#lock .err{color:#b42318;font-size:.85rem;min-height:1.2em}
a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Inventario de activos BX</b><span id="upd"></span></div>
  <main id="app"></main>

</div>

let ACTIVOS = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let byCode = new Map();
document.getElementById('upd').textContent = 'Actualizado: ' + ACTUALIZADO;
const f = (k, v, mono) => v ? `<div><dt>${k}</dt><dd class="${mono ? 'mono' : ''}">${esc(v)}</dd></div>` : '';

function ficha(a){
  const photo = a.foto ? `<img src="${esc(a.foto)}" alt="Foto de ${esc(a.desc)}">`
                       : `<div class="nophoto"><b>Sin foto</b><span>Todavía no se agrega una foto de este artículo.</span></div>`;
  return `<a class="back" href="#">← Todo el inventario</a>
    <div class="tagline"><span class="bigcode">${esc(a.code)}</span><span class="owner">Prop. ${esc(a.prop)}</span></div>
    <h1>${esc(a.desc)}${a.marca && a.marca !== 'Sin marca' ? ' · ' + esc(a.marca) : ''}</h1>
    <div class="sheet">
      <div class="photo">${photo}</div>
      <dl>
        ${f('Categoría', a.cat)}
        ${f('Marca', a.marca !== 'Sin marca' ? a.marca : '')}
        ${f('Modelo', a.modelo, true)}
        ${f('N.º de serie', a.serie, true)}
        ${f('Ubicación', a.ubic)}
        ${f('Propietario', a.prop)}
        ${f('Responsable', a.resp)}
        ${f('Estado', a.estado)}
        <div><dt>Etiqueta</dt><dd>${a.etiqueta === 'Sí' ? '<span class="state si">Lleva etiqueta</span>' : '<span class="state no">Solo registro</span>'}</dd></div>
        ${f('Observaciones', a.obs)}
      </dl>
    </div>`;
}
function lista(q){
  const t = (q || '').trim().toLowerCase();
  const rows = ACTIVOS.filter(a => a.estado !== 'Baja')
    .filter(a => !t || [a.code, a.desc, a.marca, a.modelo, a.serie, a.ubic, a.prop].join(' ').toLowerCase().includes(t))
    .sort((x, y) => x.code.localeCompare(y.code));
  return rows.length ? rows.map(a => `<a class="row" href="#${esc(a.code)}"><span class="code">${esc(a.code)}</span>
      <span>${esc(a.desc)}${a.marca && a.marca !== 'Sin marca' ? ' · ' + esc(a.marca) : ''}<small>${esc(a.ubic)} · Prop. ${esc(a.prop)}</small></span></a>`).join('')
    : '<div class="empty">Ningún activo coincide con la búsqueda.</div>';
}
function render(){
  const app = document.getElementById('app');
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (code){
    const a = byCode.get(code);
    app.innerHTML = a ? ficha(a) : `<a class="back" href="#">← Todo el inventario</a><div class="empty">No encontré el activo <b class="code">${esc(code)}</b>.</div>`;
    document.title = (a ? a.code + ' · ' : '') + 'Inventario BX';
  } else {
    app.innerHTML = `<input id="q" type="search" placeholder="Buscar por código, artículo o ubicación" autocomplete="off"><div class="list" id="list">${lista('')}</div>`;
    document.getElementById('q').addEventListener('input', e => { document.getElementById('list').innerHTML = lista(e.target.value); });
    document.title = 'Inventario BX';
  }
  window.scrollTo(0, 0);
}
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function unlock(pw){
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256'},
    await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']),
    {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const KEY = 'inventariobx-pw';
function saved(){ try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function save(pw){ try { localStorage.setItem(KEY, pw); } catch (e) {} }
function forget(){ try { localStorage.removeItem(KEY); } catch (e) {} }
function start(data){
  ACTIVOS = data; byCode = new Map(ACTIVOS.map(a => [a.code, a]));
  window.addEventListener('hashchange', render); render();
}
function showLock(msg){
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  document.getElementById('app').innerHTML = `<div id="lock">
    <h2>Inventario protegido</h2>
    <p>${code ? 'Para ver el activo <b class="code">' + esc(code) + '</b> escribe' : 'Escribe'} la contraseña de la oficina.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Recordar en este dispositivo</label>
    <div class="err" id="err">${msg || ''}</div>
    <button type="button" id="go">Entrar</button></div>`;
  const pw = document.getElementById('pw'); pw.focus();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  let busy = false;
  const go = async () => {
    if (busy) return;
    if (!pw.value){ err.textContent = 'Escribe la contraseña.'; pw.focus(); return; }
    if (!(window.crypto && crypto.subtle)){ err.textContent = 'Este navegador no puede abrir la página. Ábrela en Safari o Chrome desde inventariobx.github.io.'; return; }
    busy = true; btn.disabled = true; btn.textContent = 'Abriendo…'; err.textContent = '';
    let d;
    try { d = await unlock(pw.value.trim()); }
    catch (e) { busy = false; btn.disabled = false; btn.textContent = 'Entrar'; err.textContent = 'Contraseña incorrecta. Revisa mayúsculas y el guion.'; pw.select(); return; }
    if (document.getElementById('rem').checked) save(pw.value.trim());
    start(d);
  };
  btn.addEventListener('click', go);
  pw.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } });
}
(async () => {
  const pw = saved();
  if (pw){ try { return start(await unlock(pw)); } catch (e) { forget(); return showLock('La contraseña cambió. Escribe la nueva.'); } }
  showLock();
})();
document.getElementById('salir').onclick = e => { e.preventDefault(); forget(); location.reload(); };
</script>
